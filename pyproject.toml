[tool.poetry]
name = "py_branches"
version = "1.7.0"
description = "Reusable behavior-tree behaviors and decorators for Python, built on py_trees."
authors = ["Shunong Wu <shunongwu@gmail.com>"]
license = "BSD"
readme = "README.md"
homepage = "https://github.com/snwu1996/py_branches"
repository = "https://github.com/snwu1996/py_branches"
documentation = "https://py-branches.readthedocs.io/en/latest/"
# PyPI indexes these, and they are the only keyword surface the package page
# has besides the README.
keywords = [
    "py-trees",
    "behavior-tree",
    "behaviour-tree",
    "behavior-trees",
    "decorators",
    "blackboard",
    "robotics",
    "ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    # PyPI's left-hand nav filters on these, so each supported minor gets a row.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{ include = "py_branches" }]
# Belt and braces: poetry already skips VCS-ignored files, but an agent
# settings directory inside the package must never reach a wheel even if it
# is untracked or someone commits a shared settings.json.
exclude = ["py_branches/.claude", "py_branches/**/.claude"]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/snwu1996/py_branches/issues"
"Changelog" = "https://github.com/snwu1996/py_branches/releases"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
py-trees = "*"
pyyaml = "*"
pynput = "^1.7"
numpy = "*"
scikit-learn = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pyright = "^1.1.414"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1"
sphinx-rtd-theme = "^3.0"
myst-parser = "^4.0"
sphinx-autodoc-typehints = "^2.5"
sphinx-sitemap = "^2.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["py_branches", "tests"]
typeCheckingMode = "basic"
# No venvPath/venv: pyright resolves imports from whichever interpreter is on
# PATH, so `poetry run pyright` works against the active venv both locally and
# in CI, wherever poetry puts it.

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9, F) plus the families this codebase already
# reaches for: A and BLE are here because the tree carries noqa codes for
# both, so the rules were being honoured by hand before anything enforced
# them.
select = ["E4", "E7", "E9", "F", "A", "B", "BLE", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The seed must be set before py_branches.random is imported, so these
# imports deliberately sit below a statement.
"tests/test_random_behaviors.py" = ["E402"]
# Sphinx dictates these module-level names; they are config, not our API.
"docs/conf.py" = ["A001"]

[tool.ruff.lint.isort]
# __init__.py imports each submodule on its own line; keep that shape rather
# than letting isort collapse them into one `from . import a, b, c`.
force-single-line = true

[tool.coverage.run]
source = ["py_branches"]
# These behaviors are mostly if-ladders over tick status, so statement-only
# coverage would overstate how well they are exercised.
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
