name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
    # labeled/unlabeled so adding 'no-version-bump' re-runs the version check
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build package
        run: poetry build

      - name: Verify build artifacts
        run: ls -la dist/

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest tests/ -v

  version:
    # Release PRs must bump the version; label a PR 'no-version-bump' to skip.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-version-bump')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need base branch history to read its pyproject.toml.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11+ for stdlib tomllib; the check needs no third-party packages.
          python-version: "3.12"

      - name: Extract base branch pyproject.toml
        run: |
          git show "origin/${{ github.base_ref }}:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml"

      - name: Check version was bumped
        run: |
          python scripts/check_version_bump.py \
            --base "$RUNNER_TEMP/base-pyproject.toml" \
            --head pyproject.toml
